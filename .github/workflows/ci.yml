# SCM DataOps CI/CD Pipeline
# PR時: validate + dev deploy + integration test
# mainマージ時: prod deploy

name: SCM DataOps CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABRICKS_HOST_DEV: ${{ secrets.DATABRICKS_HOST_DEV }}
  DATABRICKS_TOKEN_DEV: ${{ secrets.DATABRICKS_TOKEN_DEV }}
  DATABRICKS_HOST_PROD: ${{ secrets.DATABRICKS_HOST_PROD }}
  DATABRICKS_TOKEN_PROD: ${{ secrets.DATABRICKS_TOKEN_PROD }}

jobs:
  # ============================================================
  # PR時: バリデーション + dev統合テスト
  # ============================================================
  validate-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (dev)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN_DEV }}
        run: databricks bundle validate -t dev

      - name: Deploy to dev
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN_DEV }}
        run: databricks bundle deploy -t dev

      - name: Run integration test (dev job)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks bundle run scm_daily_orchestration -t dev --wait

  # ============================================================
  # mainマージ時: prod デプロイ
  # ============================================================
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (prod)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle validate -t prod

      - name: Deploy to prod
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle deploy -t prod
