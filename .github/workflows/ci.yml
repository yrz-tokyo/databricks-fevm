# SCM DataOps CI/CD Pipeline
# PR時: unit test + validate + dev deploy + integration test
# mainマージ時: prod deploy

name: SCM DataOps CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # dev: サービスプリンシパル OAuth 認証
  DATABRICKS_HOST_DEV: ${{ secrets.DATABRICKS_HOST_DEV }}
  DATABRICKS_CLIENT_ID_DEV: ${{ secrets.DATABRICKS_CLIENT_ID_DEV }}
  DATABRICKS_CLIENT_SECRET_DEV: ${{ secrets.DATABRICKS_CLIENT_SECRET_DEV }}
  # prod: サービスプリンシパル OAuth 認証
  DATABRICKS_HOST_PROD: ${{ secrets.DATABRICKS_HOST_PROD }}
  DATABRICKS_CLIENT_ID_PROD: ${{ secrets.DATABRICKS_CLIENT_ID_PROD }}
  DATABRICKS_CLIENT_SECRET_PROD: ${{ secrets.DATABRICKS_CLIENT_SECRET_PROD }}

jobs:
  # ============================================================
  # PR時: ユニットテスト + バリデーション + dev統合テスト
  # ============================================================
  validate-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- ユニットテスト（Databricks 不要・数秒で完了）---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

      # --- バンドル検証 + デプロイ + 統合テスト ---
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (dev)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ env.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ env.DATABRICKS_CLIENT_SECRET_DEV }}
        run: databricks bundle validate -t dev

      - name: Deploy to dev
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ env.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ env.DATABRICKS_CLIENT_SECRET_DEV }}
        run: databricks bundle deploy -t dev

      - name: Run integration test (dev job)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ env.DATABRICKS_CLIENT_ID_DEV }}
          DATABRICKS_CLIENT_SECRET: ${{ env.DATABRICKS_CLIENT_SECRET_DEV }}
        run: |
          databricks bundle run scm_daily_orchestration -t dev --wait

  # ============================================================
  # mainマージ時: prod デプロイ
  # ============================================================
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle (prod)
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_PROD }}
          DATABRICKS_CLIENT_ID: ${{ env.DATABRICKS_CLIENT_ID_PROD }}
          DATABRICKS_CLIENT_SECRET: ${{ env.DATABRICKS_CLIENT_SECRET_PROD }}
          BUNDLE_VAR_service_principal_name: ${{ env.DATABRICKS_CLIENT_ID_PROD }}
        run: databricks bundle validate -t prod

      - name: Deploy to prod
        env:
          DATABRICKS_HOST: ${{ env.DATABRICKS_HOST_PROD }}
          DATABRICKS_CLIENT_ID: ${{ env.DATABRICKS_CLIENT_ID_PROD }}
          DATABRICKS_CLIENT_SECRET: ${{ env.DATABRICKS_CLIENT_SECRET_PROD }}
          BUNDLE_VAR_service_principal_name: ${{ env.DATABRICKS_CLIENT_ID_PROD }}
        run: databricks bundle deploy -t prod
